name: YURI2 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64
        run: >
          dotnet publish YURI2/src/YURI/YURI.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -o publish/win-x64

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath YURI2-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YURI2-win-x64
          path: YURI2-win-x64.zip

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish YURI2/src/YURI/YURI.csproj -c Release -r ${{ matrix.rid }}
          --self-contained
          -o publish/${{ matrix.rid }}

      - name: Bundle .app
        run: |
          chmod +x YURI2/tools/make-app.sh YURI2/tools/sign-mac.sh
          YURI2/tools/make-app.sh publish/${{ matrix.rid }} bundle/${{ matrix.rid }}
          YURI2/tools/sign-mac.sh bundle/${{ matrix.rid }}/YURI.app

      - name: Zip build
        run: |
          cd bundle/${{ matrix.rid }}
          zip -r ../../YURI2-${{ matrix.rid }}.zip YURI.app

      - uses: actions/upload-artifact@v4
        with:
          name: YURI2-${{ matrix.rid }}
          path: YURI2-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
